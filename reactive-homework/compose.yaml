services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sports
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
    ports:
      - "5432:5432"

  rakuten-mock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      - ./rakuten-mock:/home/wiremock
