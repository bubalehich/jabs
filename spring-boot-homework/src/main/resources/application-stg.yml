spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  security:
    oauth2:
      authorizationserver:
        issuer: ${ISSUER_URI}
